- date: "Feb. 2026"
  text: "In DC for a weeklong research appointment at the Smithsonian, hosted by Nick Pyenson."

- date: "Dec. 2025"
  text: "Joined the 42nd annual ACS/LA <a href=\"https://acs-la.org/gray-whale-census/\">Gray Whale Census</a> and Behavior Project. If you're in LA, come help sight and track migrating whales!"

- date: "Nov. 2025"
  text: "In SF for a New Science fellows meetup, hosted by Alexey Guzey."

- date: "Mar. 2025"
  text: "In SF to volunteer at the <a href=\"https://insidetrail.com/calendar/marin-ultra-challenge/\">Marin Ultra Challenge</a> trail race."

- date: "Oct. 2024"
  text: "In Montpellier to give a talk at the <a href=\"https://www1.montpellier.inra.fr/wp-inra/bpmp/en/\">Institut des Sciences des Plantes de Montpellier</a>, based partly on work with Matthieu Platre on algorithmic trade-offs in plant development."

- date: "Sep. 2024"
  text: "In Dresden to teach the Physical Biology of the Cell <a href=\"https://www.mpi-cbg.de/news-outreach/news-media/article/quantitative-biology-takes-center-stage-at-the-physical-biology-of-the-cell-summer-school\">summer school</a> at the <a href=\"https://www.mpi-cbg.de/\">Max Planck Institute of Molecular Cell Biology and Genetics</a> (with Rob Phillips, Jané Kondev, and Ana Duarte)."

- date: "Aug. 2024"
  text: "In the Galápagos aboard the National Geographic Endeavour II as a course assistant for a Caltech Associates trip (with Rob Phillips, Victoria Orphan, and Tom Röschinger)."
